name: Mirror

on:
  schedule:
    - cron: "36 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-ucs-fonts-mirror
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Mirror
        run: bash scripts/mirror.bash

      - name: Verify
        run: bash scripts/check-mirror.bash

      - name: Commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/commit-mirror.bash

  publish:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
