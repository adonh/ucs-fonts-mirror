version: 2

updates:

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 8
    groups:
      actions:
        patterns:
          - '*'

