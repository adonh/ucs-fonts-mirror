#:schema https://www.schemastore.org/prek.json

default_stages = [ "pre-commit", "manual" ]
default_install_hook_types = [ "pre-commit", "pre-push" ]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", exclude = '^docs/(downloads|examples)/' },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-jsonc" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-xml" },
  { id = "check-yaml", args = [ "--allow-multiple-documents" ] },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer", exclude = '^docs/' },
  { id = "fix-byte-order-marker", exclude = '^docs/' },
  { id = "mixed-line-ending", exclude = '^docs/' },
  { id = "trailing-whitespace", exclude = '^docs/', args = [ "--markdown-linebreak-ext", "md" ] }
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [ { id = "actionlint", stages = [ "pre-push", "manual" ] } ]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "a6564f5d57444e123433a5c9af733e3975c77229" # v0.11.0.1-1
hooks = [ { id = "shellcheck", stages = [ "pre-push", "manual" ] } ]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-mirror"
name = "Verify mirrored checksums"
stages = [ "pre-push", "manual" ]
entry = "bash scripts/check-mirror.bash"
language = "system"
files = '^(docs/|scripts/(upstream-sha256sums\.txt|check-mirror\.bash)$)'
pass_filenames = false
